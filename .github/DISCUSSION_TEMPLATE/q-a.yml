body:
  - type: markdown
    attributes:
      value: |
        If something in Visor is broken, open a bug report in Issues instead. Security problems go through the Security tab.
        Remove serial numbers, Bluetooth addresses, tokens and API keys from everything you paste.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you want to do and what you tried.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Visor version
      description: Settings, About.
  - type: input
    id: glasses
    attributes:
      label: Glasses and firmware
      placeholder: Ray-Ban Meta (Gen 2), 72387580077200100
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Pixel 9, Android 16
