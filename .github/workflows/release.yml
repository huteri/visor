# Builds the signed release APK for a version tag (v1.2.3) and publishes it as a GitHub release.
# Run it by hand to get a draft release of the current main instead.
#
# Secrets: VISOR_KEYSTORE_BASE64 (the PKCS12 keystore, base64), VISOR_KEYSTORE_PASSWORD, VISOR_KEY_ALIAS,
# and Meta's app tokens VISOR_META_HW_TOKEN, VISOR_META_AR_TOKEN and VISOR_META_FRL_TOKEN (README, Build from source).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      automatic:
        type: boolean
        default: false
    secrets:
      VISOR_KEYSTORE_BASE64:
        required: true
      VISOR_KEYSTORE_PASSWORD:
        required: true
      VISOR_KEY_ALIAS:
        required: true
      VISOR_META_HW_TOKEN:
        required: true
      VISOR_META_AR_TOKEN:
        required: true
      VISOR_META_FRL_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the draft release, without the v (for example 0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  # Per-SHA groups preserve every merge (global concurrency drops pending runs).
  # Atomic tag reservations in auto_release.py serialize version allocation.
  group: ${{ inputs.automatic && format('auto-release-{0}', github.sha) || 'release' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.automatic
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      eligible: ${{ steps.prepare.outputs.eligible }}
      name: ${{ steps.prepare.outputs.name }}
      code: ${{ steps.prepare.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Reserve version for exact merged main SHA
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGED_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/auto_release.py

  release:
    needs: prepare
    if: always() && ((!inputs.automatic && needs.prepare.result == 'skipped') || (needs.prepare.result == 'success' && needs.prepare.outputs.eligible == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          AUTOMATIC: ${{ inputs.automatic }}
          AUTO_NAME: ${{ needs.prepare.outputs.name }}
        run: |
          if [ "$AUTOMATIC" = true ]; then
            name="$AUTO_NAME"
            draft=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            name="${GITHUB_REF_NAME#v}"
            draft=false
          else
            name="$INPUT_VERSION"
            draft=true
          fi
          if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "error: '$name' is not a version like 1.2.3 or 1.2.3-beta.1" >&2
            exit 1
          fi
          # 1.2.3 -> 10203, so every later version installs over the one before.
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          {
            echo "name=$name"
            echo "code=$code"
            echo "draft=$draft"
            echo "prerelease=$([ -n "${BASH_REMATCH[4]}" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Check the secrets and restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.VISOR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VISOR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VISOR_KEY_ALIAS }}
          META_HW_TOKEN: ${{ secrets.VISOR_META_HW_TOKEN }}
          META_AR_TOKEN: ${{ secrets.VISOR_META_AR_TOKEN }}
          META_FRL_TOKEN: ${{ secrets.VISOR_META_FRL_TOKEN }}
        run: |
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS META_HW_TOKEN META_AR_TOKEN META_FRL_TOKEN; do
            if [ -z "${!secret}" ]; then
              echo "error: the VISOR_$secret secret is not set" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/visor-release.p12"

      - name: Verify streaming responses
        run: |
          python3 -m unittest discover -s scripts/tests -v
          ./gradlew :core:assistant:testDebugUnitTest

      - name: Build the release APK
        env:
          VISOR_KEYSTORE: ${{ runner.temp }}/visor-release.p12
          VISOR_KEYSTORE_PASSWORD: ${{ secrets.VISOR_KEYSTORE_PASSWORD }}
          VISOR_KEY_ALIAS: ${{ secrets.VISOR_KEY_ALIAS }}
          VISOR_VERSION_NAME: ${{ steps.version.outputs.name }}
          VISOR_VERSION_CODE: ${{ steps.version.outputs.code }}
          VISOR_META_HW_TOKEN: ${{ secrets.VISOR_META_HW_TOKEN }}
          VISOR_META_AR_TOKEN: ${{ secrets.VISOR_META_AR_TOKEN }}
          VISOR_META_FRL_TOKEN: ${{ secrets.VISOR_META_FRL_TOKEN }}
        run: ./gradlew :app:assembleRelease

      - name: Check the signature and name the APK
        env:
          NAME: ${{ steps.version.outputs.name }}
          VISOR_KEYSTORE_PASSWORD: ${{ secrets.VISOR_KEYSTORE_PASSWORD }}
          VISOR_KEY_ALIAS: ${{ secrets.VISOR_KEY_ALIAS }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/visor-apk-certs.txt"
          keytool -exportcert -keystore "$RUNNER_TEMP/visor-release.p12" -storetype PKCS12 -storepass:env VISOR_KEYSTORE_PASSWORD -alias "$VISOR_KEY_ALIAS" -file "$RUNNER_TEMP/visor-release-cert.der"
          expected=$(sha256sum "$RUNNER_TEMP/visor-release-cert.der" | cut -d ' ' -f 1)
          actual=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/visor-apk-certs.txt")
          test "$actual" = "$expected"
          metadata=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk")
          grep -F "versionCode='${{ steps.version.outputs.code }}'" <<< "$metadata"
          grep -F "versionName='$NAME'" <<< "$metadata"
          mkdir -p dist
          cp "$apk" "dist/visor-$NAME.apk"
          (cd dist && sha256sum "visor-$NAME.apk" > "visor-$NAME.apk.sha256")

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          DRAFT: ${{ steps.version.outputs.draft }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          AUTOMATIC: ${{ inputs.automatic }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--title "Visor $NAME" --generate-notes)
          if [ "$DRAFT" = "true" ]; then flags+=(--draft --target "$GITHUB_SHA"); fi
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if [ "$AUTOMATIC" = true ] && gh release view "v$NAME" --json isDraft,targetCommitish > "$RUNNER_TEMP/visor-release.json"; then
            python3 -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/visor-release.json")); assert r["isDraft"] and r["targetCommitish"] == os.environ["GITHUB_SHA"], "Refusing changed/public release"'
            gh release upload "v$NAME" "dist/visor-$NAME.apk" "dist/visor-$NAME.apk.sha256" --clobber
          else
            gh release create "v$NAME" "dist/visor-$NAME.apk" "dist/visor-$NAME.apk.sha256" "${flags[@]}"
          fi

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/visor-release.p12" "$RUNNER_TEMP/visor-release-cert.der" "$RUNNER_TEMP/visor-apk-certs.txt" "$RUNNER_TEMP/visor-release.json"
